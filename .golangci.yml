version: "2"

linters:
  default: standard
  enable:
    - revive
    - gocritic
    - gocognit
    - gocyclo
    - dupl
    - errorlint
    - bodyclose
    - gosec
    - exhaustive
    - nolintlint
    - depguard
    # what the bot runs on Go PRs (internal/checks golangciConfig)
    - forbidigo
    - noctx
  settings:
    depguard:
      rules:
        main:
          allow: [$gostd, diffharbor] # stdlib only
        # The package boundaries: the core knows no forge and no job, the forges no job, and job no server.
        core:
          files: ["**/internal/review/**", "**/internal/checks/**", "**/internal/agent/**", "**/internal/report/**",
            "**/internal/diff/**", "**/internal/text/**", "**/internal/proc/**", "**/internal/ticket/**",
            "**/internal/assets/**", "**/internal/store/**"]
          deny:
            - pkg: diffharbor/internal/forge
              desc: the core knows no forge; job joins them
            - pkg: diffharbor/internal/job
              desc: job runs the core, not the other way round
            - pkg: diffharbor/internal/server
              desc: server is HTTP and the queue only
        forge:
          files: ["**/internal/forge/**"]
          deny:
            - pkg: diffharbor/internal/job
              desc: a forge is a port and its adapters, it runs no job
            - pkg: diffharbor/internal/server
              desc: server is HTTP and the queue only
        job:
          files: ["**/internal/job/**"]
          deny:
            - pkg: diffharbor/internal/server
              desc: server calls job
            - pkg: diffharbor/internal/forge/
              desc: jobs see a forge through the port (forge.Forge, forge.PR) only
        leaf:
          files: ["**/internal/diff/**", "**/internal/text/**", "**/internal/assets/**", "**/internal/store/**"]
          deny:
            - pkg: diffharbor/internal
              desc: diff, text, assets and store are leaves
    gocognit:
      min-complexity: 50
    gocyclo:
      min-complexity: 50
    errcheck:
      exclude-functions: [fmt.Fprint, fmt.Fprintf, fmt.Fprintln, os.Remove, os.RemoveAll, (io.Closer).Close, (*os.File).Close, (*os.Root).Close]
    gosec:
      excludes:
        - G104 # errcheck checks these
        - G204 # proc.Command is the exec wrapper; args are ours
        - G301 # root writes, node (Pi, checks) reads: 0755/0644 on purpose
        - G302
        - G306
        - G706 # logs carry repo names and logins from signed webhooks; nothing parses the log
    forbidigo:
      forbid:
        - pattern: ^http\.DefaultClient$
          msg: has no timeout; use an http.Client with Timeout
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gocognit, gocyclo, gosec, noctx]
      # The client has a timeout; the job's context would drop the "Review stopped" status a cancel posts.
      - path: internal/forge/(github/github|gitlab/gitlab)\.go
        linters: [noctx]
      - path: cmd/
        linters: [noctx]

formatters:
  enable:
    - gofumpt
    - goimports
