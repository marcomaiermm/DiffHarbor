{{/* The color tokens; the Tailwind classes in styles.html read these. */}}
{{define "theme"}}
<style>
/* Geist's grays: hairline borders, one ink color, blue only for what is current or done */
:root {
  --background: #fff; --foreground: #171717; --card: #fff; --card-foreground: #171717;
  --muted: #f5f5f5; --muted-foreground: #6b6b6b; --accent: #f2f2f2; --accent-foreground: #171717;
  --secondary: #f2f2f2; --secondary-foreground: #171717; --primary: #171717; --primary-foreground: #fff;
  --border: #ebebeb; --ring: #0070f3; --destructive: #e5484d; --radius: 0.5rem;
  --font-sans: "Geist Variable", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sidebar: #fafafa; --sidebar-foreground: #171717; --sidebar-accent: #ebebeb; --sidebar-accent-foreground: #171717;
  --sidebar-border: #ebebeb; --sidebar-ring: #0070f3; --sidebar-width: 17rem; --sidebar-width-collapsed: 3.25rem;
  --input: #ebebeb; --popover: #fff; --popover-foreground: #171717;
  /* the code's colors: the syntax theme's background and text once it loads, the rest mixed from them */
  --diff-bg: #e1e2e7; --diff-fg: #3760bf; --diff-add: #587539; --diff-del: #c64343; --diff-link: #007197;
  --diff-mod: rgb(46 125 233 / 0.13); --diff-mod-chg: rgb(46 125 233 / 0.3);
}
.dark {
  --background: #0a0a0a; --foreground: #ededed; --card: #0a0a0a; --card-foreground: #ededed;
  --muted: #1a1a1a; --muted-foreground: #a1a1a1; --accent: #1c1c1c; --accent-foreground: #ededed;
  --secondary: #1f1f1f; --secondary-foreground: #ededed; --primary: #ededed; --primary-foreground: #0a0a0a;
  --border: #262626; --ring: #52a8ff; --destructive: #ff6166;
  --sidebar: #0a0a0a; --sidebar-foreground: #ededed; --sidebar-accent: #1c1c1c; --sidebar-accent-foreground: #ededed;
  --sidebar-border: #262626; --sidebar-ring: #52a8ff; --input: #262626; --popover: #0a0a0a; --popover-foreground: #ededed;
  --diff-bg: #1a1b26; --diff-fg: #a9b1d6; --diff-add: #9ece6a; --diff-del: #f7768e; --diff-link: #7dcfff;
  --diff-mod: rgb(122 162 247 / 0.13); --diff-mod-chg: rgb(122 162 247 / 0.32);
}
:root {
  --diff-add-bg: rgb(158 206 106 / 0.14); --diff-del-bg: rgb(247 118 142 / 0.13); /* a line added, removed: diff, inventory, story */
  --diff-hunk: color-mix(in oklab, var(--diff-fg) 5%, var(--diff-bg));
  --diff-hover: color-mix(in oklab, var(--diff-fg) 12%, var(--diff-bg));
  --diff-dim: color-mix(in oklab, var(--diff-fg) 32%, var(--diff-bg));
  --diff-muted: color-mix(in oklab, var(--diff-fg) 58%, var(--diff-bg));
}
</style>
{{end}}
