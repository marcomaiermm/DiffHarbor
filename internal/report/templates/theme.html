{{/* The color tokens: override "theme" to rebrand the page. Harbor Night by default, Moon where the reader's system
asks for light; shadcn's tokens, which the diff, the popover and the sheets read, follow them. */}}
{{define "theme"}}
<style>
:root {
  --ground: #16161e; --surface: #1a1b26; --raised: #1f2335; --hover: #24283b; --line: #292e42; --line2: #30364f; --line3: #3b4261;
  --line-ev: #656d91; --ink: #c0caf5; --inkhi: #e0e6ff; --ink2: #a9b1d6; --ink3: #98a1cc; --code: #c0caf5; --add: #9ece6a;
  --remove: #f77a91; --major: #ff9e64; --critical: #f77a91; --verified: #73daca; --acc: #7aa2f7;
  --sans: "Geist Variable", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --ground: #1e2030; --surface: #222436; --raised: #272a40; --hover: #2f334d; --line: #2f334d; --line2: #3b4062; --line3: #444a73;
    --line-ev: #6d75a0; --ink: #c8d3f5; --inkhi: #e4eaff; --ink2: #b4c0e8; --ink3: #9fa9d7; --code: #c8d3f5; --add: #c3e88d;
    --remove: #ff838c; --major: #ff966c; --critical: #ff838c; --verified: #4fd6be; --acc: #82aaff;
  }
}
:root, .dark {
  --background: var(--ground); --foreground: var(--ink); --card: var(--surface); --card-foreground: var(--ink);
  --muted: var(--raised); --muted-foreground: var(--ink3); --accent: var(--hover); --accent-foreground: var(--inkhi);
  --secondary: var(--raised); --secondary-foreground: var(--ink); --primary: var(--acc); --primary-foreground: var(--ground);
  --border: var(--line); --ring: var(--acc); --destructive: var(--critical); --radius: 0.5rem;
  --font-sans: var(--sans); --font-mono: var(--mono);
  --input: var(--line2); --popover: var(--raised); --popover-foreground: var(--ink);
  /* the code's colors: the syntax theme's background and text once it loads, the rest mixed from them */
  --diff-bg: var(--surface); --diff-fg: var(--ink2); --diff-add: var(--add); --diff-del: var(--remove); --diff-link: #7dcfff;
  --diff-mod: rgb(122 162 247 / 0.13); --diff-mod-chg: rgb(122 162 247 / 0.32);
  --k-fn: #7aa2f7; --k-type: #bb9af7; --k-var: #e0af68;
  /* color with meaning (decision 37): an item's kind, a file's kind; the syntax theme's hues, so code and page agree */
  --c-diff: var(--k-type); --c-before: var(--k-var); --c-test: var(--diff-link); --c-code: var(--acc); --c-sql: var(--k-var);
  --diff-add-bg: rgb(158 206 106 / 0.14); --diff-del-bg: rgb(247 118 142 / 0.13);
  --diff-hunk: color-mix(in oklab, var(--diff-fg) 5%, var(--diff-bg));
  --diff-hover: color-mix(in oklab, var(--diff-fg) 12%, var(--diff-bg));
  --gap-ink: color-mix(in oklab, var(--diff-fg), var(--foreground) 45%); /* the page text in the code ink: 4.5:1 on the gap band */
  --diff-dim: color-mix(in oklab, var(--gap-ink) 70%, var(--diff-bg)); /* line numbers: 4.5:1 or better */
  --diff-muted: color-mix(in oklab, var(--diff-fg) 58%, var(--diff-bg));
}
</style>
{{end}}
