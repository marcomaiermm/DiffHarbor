{{/* The page: disclosures, the map's hover and selection, filters, versions, viewed marks, the diff's gaps, keys. */}}
{{define "script"}}
<script>
(() => {
  const prefix = {{printf "diffharbor:%s#%d:" .Repo .Number}};
  const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const set = (k, on) => { try { on ? localStorage.setItem(k, on === true ? "1" : on) : localStorage.removeItem(k); } catch {} };
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const body = document.body;
  const kept = new Map(), $$k = s => kept.get(s) || kept.set(s, $$(s)).get(s); // lists the page never changes
  // What a keydown means, as TanStack Hotkeys reads it: nothing while an input method composes; the letter typed, else
  // the one on that key's place (a Cyrillic layout still has its J)
  const composing = e => e.isComposing || e.keyCode === 229 || e.key === "Process" || e.key === "Unidentified";
  const letter = e => /^[a-z]$/i.test(e.key) ? e.key.toLowerCase() : /^Key[A-Z]$/.test(e.code) ? e.code.slice(3).toLowerCase() : e.key;

  // the diff view: <html data-diff> unified or split, kept across PRs; the CSS and the split script do the rest
  const choose = v => {
    document.documentElement.dataset.diff = v;
    for (const b of $$("button[data-diff]")) b.setAttribute("aria-pressed", b.dataset.diff === v);
    set("diffharbor:diff", v);
  };
  choose(get("diffharbor:diff") || "unified");

  // disclosures: a button with aria-expanded shows the region it controls, by id or the element after it
  const bodyOf = b => b.getAttribute("aria-controls") ? document.getElementById(b.getAttribute("aria-controls"))
    : b.parentElement.matches("h3") ? b.parentElement.nextElementSibling : b.nextElementSibling;
  const disclose = (b, on) => {
    const r = bodyOf(b);
    if (!r) return;
    b.setAttribute("aria-expanded", on);
    r.hidden = !on;
    const t = b.dataset.on && b.querySelector("span");
    if (t) t.textContent = on ? b.dataset.on : b.dataset.off;
    if (b.dataset.traceBoxes !== undefined) { // the traced path and a selection exclude each other
      if (on && sel) select(null);
      trace(on, b);
    }
    if (b.matches(".sbtn")) allLabel(b.closest(".pgp"));
  };
  // a part's steps open or close together: the button says what it does next
  const allLabel = g => {
    const a = $("[data-all-steps]", g);
    if (a) a.textContent = $$(".sbtn", g).every(x => x.getAttribute("aria-expanded") === "true") ? "Close all steps" : "Open all steps";
  };
  const discButtons = ".icb, .pbb, .sbtn, .tch, button[data-disc]";
  // a region inside closed ones: open each, outermost last, and a closed file too
  const fileOpen = (f, on) => { f.toggleAttribute("open", on); $(".file-toggle", f).setAttribute("aria-expanded", on); };
  const openUp = el => {
    for (let p = el; p && p !== body; p = p.parentElement) {
      if (p.matches(".file") && p !== el) fileOpen(p, true);
      if (!p.hidden) continue;
      const b = p.id && $(`[aria-controls="${CSS.escape(p.id)}"]`) || [p.previousElementSibling, p.previousElementSibling?.firstElementChild].find(x => x?.matches?.(discButtons));
      if (b) disclose(b, true); else p.hidden = false;
    }
  };

  // a file's head opens and closes its diff; the Viewed box beside it is not part of the button
  const boxes = $$("input[data-key]");
  // a part or a step is read once all its files are viewed: its header, its step row, its rail rows show the mark
  const mark = (el, on) => { el.classList.toggle("rd", on); const t = $("[data-rmark]", el); if (t) t.textContent = on ? ", read" : ", not read"; };
  const done = el => { const fs = $$(".file", el); return fs.length > 0 && fs.every(f => f.classList.contains("seen")); };
  const sync = () => {
    for (const b of boxes) b.closest(".file").classList.toggle("seen", b.checked);
    for (const s of $$("[data-step]")) mark($(".sbtn", s), done(s));
    for (const p of $$(".pb")) {
      const on = done(p);
      mark($(".pbb", p), on);
      for (const r of $$(".rrow").filter(r => r.getAttribute("href") === "#" + p.id)) mark(r, on); // by link: a page without a map has a Code block with no box
    }
    const all = !!$("#read") && done($("#read"));
    const vw = $("[data-viewed]"); // Changes' status line counts the files viewed on this page
    if (vw) { const fs = $$(".file", $("#read")); vw.textContent = fs.length ? ` · ${fs.filter(f => f.classList.contains("seen")).length} of ${fs.length} files viewed` : ""; }
    for (const r of $$('.rrow[href="#read"]')) mark(r, all);
    filter();
  };
  for (const b of boxes) {
    b.checked = !!get(prefix + b.dataset.key);
    if (b.checked) fileOpen(b.closest(".file"), false); // read already: a jump to it opens it again
    b.addEventListener("change", () => {
      set(prefix + b.dataset.key, b.checked);
      const d = b.closest(".file");
      if (b.checked && d.hasAttribute("open")) {
        fileOpen(d, false);
        if (d.getBoundingClientRect().top < 0) d.scrollIntoView(); // the next file starts where this one did
      }
      sync();
    });
  }

  // Read the change's filter: all, the files not viewed, the files changed since the Since base. For this page only
  let mode = "all";
  const read = $("#read");
  const filter = () => {
    if (!read) return;
    for (const f of $$(".file", read)) f.hidden = mode === "unviewed" ? $("input[data-key]", f)?.checked : mode === "changed" ? !f.hasAttribute("data-changed") : false;
    for (const s of $$("[data-step]", read)) s.hidden = mode !== "all" && !$$(".file", s).some(f => !f.hidden);
    for (const b of $$(".pb", read)) {
      const files = $$(".file", b);
      $("[data-empty]", b).hidden = mode === "all" || !files.length || files.some(f => !f.hidden);
    }
  };
  const setMode = m => {
    mode = m;
    for (const b of $$("button[data-filter]")) b.setAttribute("aria-pressed", b.dataset.filter === m);
    filter();
  };

  // the map: hover lights a box's lines and neighbours; a click selects it and narrows the page to it (5.14)
  const map = $("#map");
  const fig = key => map && $(`.mfig .mb[data-box="${CSS.escape(key)}"], .mbrow .mb[data-box="${CSS.escape(key)}"]`, map);
  const ids = s => (s || "").split(" ").filter(Boolean).map(id => document.getElementById(id)).filter(Boolean);
  const light = (b, cls, on) => {
    if (!b) return;
    for (const x of [b, ...ids(b.dataset.nb), ...ids(b.dataset.ln), ...ids(b.dataset.keep)]) x.classList.toggle(cls, on);
  };
  let sel = null, opener = null;
  // a box the selection lights says how it touches the selected one: it calls it, is called by it, only names it;
  // its lines run marks the way the data goes, as their arrows say
  const role = (rel, up, n) => {
    if (rel === "both") return "both ways" + n;
    if (rel === "named") return up ? "names it" : "named";
    return (up ? "calls it" : "called") + n;
  };
  const roles = b => {
    for (const g of ids(b.dataset.ln)) {
      const up = g.dataset.callee === b.id, o = document.getElementById(up ? g.dataset.caller : g.dataset.callee), c = g.dataset.chev;
      if (o) o.dataset.role = role(g.dataset.rel, up, g.dataset.n ? " ×" + g.dataset.n : "");
      if (c) for (const rev of c === "both" ? [false, true] : [c === "a"]) {
        const f = g.firstElementChild.cloneNode();
        f.setAttribute("class", "flow" + (rev ? " rev" : ""));
        g.append(f);
      }
    }
  };
  const unrole = () => {
    for (const x of $$(".mb[data-role]", map)) delete x.dataset.role;
    for (const x of $$(".nb2", map)) x.classList.remove("nb2");
    for (const x of $$(".ml .flow", map)) x.remove();
  };
  // the blast radius a step further: who calls the parts that call it, each with the caller it goes through
  const callers = b => ids(b.dataset.ln).filter(g => g.dataset.callee === b.id && g.dataset.rel !== "named").map(g => [g, document.getElementById(g.dataset.caller)]).filter(([, o]) => o);
  const second = b => {
    const near = new Set([b, ...ids(b.dataset.nb)]), far = []; // a direct neighbour keeps the role it has
    for (const [, o] of callers(b)) for (const [g, c] of callers(o)) if (!near.has(c)) far.push([g, c, o]);
    return far;
  };
  const select = (key, quiet) => {
    if (sel && fig(sel)) light(fig(sel), "nb", false);
    unrole();
    for (const m of $$(".mb.on", map)) m.classList.remove("on");
    for (const m of $$(".mb[aria-pressed=true]", map)) m.setAttribute("aria-pressed", false);
    for (const p of $$k("[data-panel]")) p.hidden = true;
    sel = key;
    const b = key && fig(key);
    if (!b) {
      sel = null;
      delete body.dataset.sel;
      if (map) delete map.dataset.pick;
      $("#fchip").hidden = true;
      for (const x of $$k("[data-item], .pb, [data-rail-box], .kt tr")) { x.classList.remove("on"); x.removeAttribute("data-off"); }
      for (const x of $$k("[data-item], .pb")) x.hidden = false;
      for (const x of $$k("[data-rail-box]")) x.hidden = false;
      for (const s of $$("#before, #read, #tests")) { const e = $(":scope > [data-empty], .sbody > [data-empty]", s); if (e) e.hidden = true; }
      counts();
      if (!quiet && /^#(part|table|box)=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
      filter();
      return;
    }
    body.dataset.sel = key;
    map.dataset.pick = key; // its own attribute: body's would restyle the page (perf report A)
    const tb = $("#trace-b");
    if (tb?.getAttribute("aria-expanded") === "true") disclose(tb, false);
    light(b, "nb", true);
    roles(b);
    b.classList.add("on");
    for (const m of $$(`.mb[data-box="${CSS.escape(key)}"]`)) m.setAttribute("aria-pressed", true);
    const panel = $(`[data-panel="${CSS.escape(key)}"]`);
    if (panel) panel.hidden = false;
    const r2 = panel && $("[data-reach2]", panel);
    if (r2) {
      const n = new Set(second(b).map(x => x[1])).size;
      r2.hidden = !n;
      r2.setAttribute("aria-pressed", false);
      r2.textContent = "Who calls those · " + n + (n === 1 ? " part" : " parts");
    }
    // the name may break after a slash, before a dot or an inner capital: <wbr>, never U+200B, so a copy stays clean
    const fname = $("#fname");
    fname.replaceChildren();
    b.dataset.label.split(/(?<=\/)|(?=\.)|(?<=[a-z])(?=[A-Z])|(?<=_)/).forEach((w, i) => { if (i) fname.append(document.createElement("wbr")); fname.append(w); });
    $("#fchip").hidden = false;
    // what stays: the box's items, and for a table the parts that write or read it and its migrations' items
    const keep = new Set([key, ...ids(b.dataset.keep).map(x => x.dataset.box)]);
    for (const c of $$k("[data-item]")) c.hidden = !keep.has(c.dataset.box);
    for (const p of $$k(".pb")) {
      p.hidden = !keep.has(p.dataset.box);
      if (!p.hidden && key.startsWith("part:")) disclose($(".pbb", p), true);
    }
    for (const r of $$k("[data-rail-box]")) r.hidden = !keep.has(r.dataset.railBox);
    for (const r of $$k(".kt tr[data-block]")) r.classList.toggle("on", keep.has($("#" + CSS.escape(r.dataset.block))?.dataset.box));
    for (const s of $$("#before, #read")) {
      const e = $(":scope > [data-empty], .sbody > [data-empty]", s), any = $$k("[data-item], .pb").some(x => !x.hidden && s.contains(x));
      if (e) { e.hidden = any; e.textContent = key.startsWith("table:") ? "Nothing here sits on the parts that write or read " + b.dataset.label + "." : "Nothing here sits on " + b.dataset.label + "."; }
    }
    counts();
    if (!quiet) {
      const [kind, name] = key.startsWith("table:") ? ["table", b.dataset.label] : key.startsWith("part:") ? ["part", b.dataset.label] : ["box", key];
      history.replaceState(null, "", "#" + kind + "=" + encodeURIComponent(name));
    }
  };
  // a section's count chip reads "{k} of {n}" while a selection hides some of its items
  const counts = () => {
    for (const c of $$k("[data-count]")) {
      const all = $$("[data-item]", c.closest("section"));
      c.dataset.n ??= c.textContent;
      const shown = all.filter(x => !x.hidden).length;
      c.textContent = sel ? shown + " of " + c.dataset.n : c.dataset.n;
    }
  };
  // three lines around a line of the diff on the page, the line marked: code shown where the reader is, no jump
  const snippet = (path, line) => {
    const file = path && line && document.getElementById(path); // a file the page doesn't show has none
    const rows = file ? $$("tr.ctx, tr.add, tr.del", file) : [];
    const at = rows.findIndex(x => !x.matches(".del") && x.cells[0].textContent === String(line));
    if (at < 0) return null;
    const d = document.createElement("div"), t = document.createElement("table"), tb = document.createElement("tbody");
    d.className = "diff pvd";
    d.setAttribute("role", "region");
    d.setAttribute("aria-label", path + ":" + line);
    t.dataset.path = path; // its colors and Split as the file's own diff: they read its path and header
    const head = $("table[data-path]", file)?.tHead;
    if (head) t.append(head.cloneNode(true));
    for (const x of rows.slice(Math.max(0, at - 3), at + 4)) {
      const c = x.cloneNode(true);
      c.removeAttribute("id");
      c.classList.toggle("at", x === rows[at]);
      tb.append(c);
    }
    t.append(tb);
    d.append(t);
    requestAnimationFrame(() => window.watchDiff?.(d)); // once the caller placed it: colored, side by side when Split is on
    return d;
  };
  // a call's line in How it connects opens its code under it; a line the diff doesn't show opens Every use
  document.addEventListener("click", e => {
    const b = e.target.closest(".cxl");
    if (!b) return;
    const row = b.closest(".cxc, .dbh, .dbir, tr"), next = row.nextElementSibling, open = b.getAttribute("aria-expanded") === "true";
    if (next?.matches(".pvd, .pvr")) { next.hidden = open; b.setAttribute("aria-expanded", !open); return; }
    const d = snippet(b.dataset.at, b.dataset.line);
    if (!d) { const n = b.closest(".cxn"); if (n) $(".cn", n)?.click(); return; }
    d.id = "pv-" + b.dataset.at + "~" + b.dataset.line;
    b.setAttribute("aria-controls", d.id);
    b.setAttribute("aria-expanded", true);
    if (row.matches("tr")) { // a table's row: the code in a row of its own, across the table
      const r = document.createElement("tr"), c = r.insertCell();
      r.className = "pvr";
      c.colSpan = row.cells.length;
      c.append(d);
      row.after(r);
    } else row.after(d);
  });
  // the panel keeps the reader where they are (decision 38): a part it names selects that part here, an item's row
  // opens what the item says under it, its code too. "Read {part}" is the one link that leaves for Changes
  let pvN = 0;
  const peekItem = r => {
    const open = r.getAttribute("aria-expanded") === "true", pv = r.nextElementSibling?.matches(".selpv") && r.nextElementSibling;
    r.setAttribute("aria-expanded", !open);
    if (pv) { pv.hidden = open; return; }
    const src = $(r.getAttribute("href"));
    if (!src) return;
    const x = ($(":scope > .icx", src) || src).cloneNode(true); // a gate has no body to open: it is its body
    for (const el of $$("h3, .gk, [data-disc], [data-more-lines]", x)) el.remove();
    for (const el of [x, ...$$("[id], [aria-controls], [aria-labelledby]", x)]) for (const a of ["id", "aria-controls", "aria-labelledby"]) el.removeAttribute(a);
    const box = document.createElement("div"), go = document.createElement("a");
    box.className = "selpv";
    box.id = "selpv-" + ++pvN;
    go.className = "lnk";
    go.href = r.getAttribute("href");
    go.textContent = "Open in " + (src.closest("section.sec")?.querySelector("h2")?.firstChild?.textContent.trim() || "the page");
    box.append(...x.childNodes, go);
    // no excerpt in the item: its line in the diff, so the code is there without leaving
    const line = /:(\d+)\s*$/.exec($(".sp", r)?.textContent || "")?.[1];
    const d = !$(".xcode", box) && src.dataset.paths && snippet(JSON.parse(src.dataset.paths)[0], line);
    if (d) box.firstElementChild ? box.firstElementChild.after(d) : box.prepend(d);
    r.setAttribute("aria-controls", box.id);
    r.after(box);
  };
  // Database's items open the same way
  document.addEventListener("click", e => { const r = e.target.closest(".dbits a.selrow"); if (r) { e.preventDefault(); peekItem(r); } });
  // Database: each foreign key a line from its column to the one it references, lit while its row is (decision 42).
  // On a wide screen with a mouse ELK lays the cards out, a port per column, as the step graphs do: the cards drag,
  // the canvas pans, Ctrl+scroll zooms; elsewhere the cards wrap
  const erd = $("[data-erd]");
  if (erd) {
    const stage = $(".dbst", erd), svg = $(".dbln", erd), cards = $$(".dbt", erd), tools = $(".graph-tools", erd), hint = $(".dbhint");
    const pairs = new Map(), NS = "http://www.w3.org/2000/svg", roomy = matchMedia("(min-width: 768px) and (hover: hover)");
    let k = 1, tx = 0, ty = 0, size = [0, 0], elk;
    const laid = () => erd.classList.contains("laid");
    const full = () => document.fullscreenElement === erd;
    // a box in the stage's own units, whatever the zoom
    const box = el => { const r = el.getBoundingClientRect(), o = stage.getBoundingClientRect(); return { l: (r.left - o.left) / k, r: (r.right - o.left) / k, t: (r.top - o.top) / k, y: (r.top + r.height / 2 - o.top) / k }; };
    // the row a key references in its card, the card's head when it names no column
    const target = (r, card) => $$("tr[data-col]", card).find(x => x.dataset.col === r.dataset.refCol) || $(".dbh", card);
    const draw = () => {
      svg.replaceChildren();
      pairs.clear();
      if (getComputedStyle(svg).display === "none") return;
      for (const r of $$("tr[data-ref]", erd)) {
        const card = document.getElementById(r.dataset.ref);
        if (!card || !r.getClientRects().length) continue;
        const to = target(r, card);
        const ca = box(r.closest(".dbt")), cb = box(card), y1 = box(r).y, y2 = box(to).y;
        // each end a straight stub that carries its marks, the curve between the stubs; one card above the other:
        // round the nearer side
        let x1, x2, s1, s2;
        if (cb.l >= ca.r) [x1, x2, s1, s2] = [ca.r, cb.l, 1, -1];
        else if (cb.r <= ca.l) [x1, x2, s1, s2] = [ca.l, cb.r, -1, 1];
        else if (cb.l + cb.r < ca.l + ca.r) [x1, x2, s1, s2] = [ca.l, cb.l, -1, -1];
        else [x1, x2, s1, s2] = [ca.r, cb.r, 1, 1];
        const a1 = x1 + s1 * 24, a2 = x2 + s2 * 24;
        const c = s1 !== s2 ? (a1 + a2) / 2 : s1 > 0 ? Math.max(a1, a2) + 16 : Math.min(a1, a2) - 16;
        const p = document.createElementNS(NS, "path"), m = document.createElementNS(NS, "path"), marks = [];
        p.setAttribute("d", `M${x1} ${y1}H${a1}C${c} ${y1} ${c} ${y2} ${a2} ${y2}H${x2}`);
        // the ends, as crow's foot notation draws them: at the key's own end zero or many (the foot on the card), zero
        // or one when the column is unique; at the row it references exactly one when the key is not null, else zero
        // or one
        const bar = (x, y) => `M${x} ${y - 6}V${y + 6}`;
        const ring = (x, y) => { const e = document.createElementNS(NS, "circle"); e.setAttribute("cx", x); e.setAttribute("cy", y); e.setAttribute("r", 3.5); marks.push(e); };
        const need = "need" in r.dataset;
        if ("guess" in r.dataset) p.classList.add("guess");
        else {
          const key = "one" in r.dataset ? bar(x1 + s1 * 7, y1) : `M${x1} ${y1 - 6}L${x1 + s1 * 11} ${y1}L${x1} ${y1 + 6}`;
          m.setAttribute("d", key + bar(x2 + s2 * 7, y2) + (need ? bar(x2 + s2 * 12, y2) : ""));
          ring(x1 + s1 * 17, y1);
          if (!need) ring(x2 + s2 * 15, y2);
        }
        svg.append(p, m, ...marks);
        pairs.set(r, [p, m, ...marks, to]);
      }
    };
    const light = r => { // two keys may share a target: what r lights, then everything else off
      const on = new Set(pairs.get(r));
      for (const xs of pairs.values()) for (const x of xs) x.classList.toggle(x.matches("tr, .dbh") ? "pk" : "on", on.has(x));
    };
    const show = () => { stage.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`; };
    // all of it in view, but never below least: the first view stays readable, left-aligned, the rest a pan away
    const fit = (least = 0.2) => {
      const [w, h] = size;
      k = Math.max(least, Math.min(1, erd.clientWidth / w, erd.clientHeight / h));
      tx = Math.max(0, (erd.clientWidth - w * k) / 2);
      ty = Math.max(0, (erd.clientHeight - h * k) / 2);
      show();
    };
    const unlay = () => {
      erd.classList.remove("laid");
      erd.style.height = stage.style.cssText = "";
      for (const c of cards) c.style.left = c.style.top = "";
      k = 1;
      tools.hidden = true;
      if (hint) hint.hidden = true;
    };
    // ELK, layered left to right: a key's table before the one it references, each line between two columns' ports
    const arrange = async () => {
      elk ??= import("https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js/+esm").then(m => new m.default());
      unlay();
      const ports = new Map(), edges = [];
      const port = (row, east) => {
        const card = row.closest(".dbt"), id = `${card.id}/${row.dataset.col ?? ""}/${east ? "e" : "w"}`;
        if (!ports.has(card.id)) ports.set(card.id, new Map());
        ports.get(card.id).set(id, { id, x: east ? card.offsetWidth : 0, y: box(row).y - box(card).t, width: 1, height: 1, layoutOptions: { "elk.port.side": east ? "EAST" : "WEST" } });
        return id;
      };
      for (const r of $$("tr[data-ref]", erd)) {
        const card = document.getElementById(r.dataset.ref);
        if (!card || card === r.closest(".dbt")) continue;
        const to = target(r, card);
        edges.push({ id: `k${edges.length}`, sources: [port(r, true)], targets: [port(to, false)] });
      }
      const g = await (await elk).layout({
        id: "db",
        layoutOptions: { "elk.algorithm": "layered", "elk.direction": "RIGHT", "elk.padding": "[top=24,left=24,bottom=24,right=24]", "elk.spacing.nodeNode": "28",
          "elk.layered.spacing.nodeNodeBetweenLayers": "80", "elk.spacing.componentComponent": "40", "elk.layered.considerModelOrder.strategy": "NODES_AND_EDGES" },
        children: cards.map(c => ({ id: c.id, width: c.offsetWidth, height: c.offsetHeight, layoutOptions: { "elk.portConstraints": "FIXED_POS" }, ports: [...(ports.get(c.id)?.values() ?? [])] })),
        edges,

    if (hs) {
      const h = hs.closest("tr");
      seeHunk(h, hs.getAttribute("aria-pressed") !== "true");
      const tb = h.closest("table"), box = $("input[data-key]", tb.closest(".file"));
      if (!$$(".hunk-seen", tb).some(x => x.getAttribute("aria-pressed") !== "true") && !box.checked) {
        box.checked = true;
        box.dispatchEvent(new Event("change"));
      } else if (h.getBoundingClientRect().top < 80) h.scrollIntoView({ block: "start" });
      return;
    }
    const fo = t.closest(".fold-toggle");
    if (fo) fo.setAttribute("aria-expanded", fo.closest("tbody").classList.toggle("open"));
  });

  // the unchanged lines between and around hunks, from the file's text at the head: read once a gap opens. A gap
  // shows 20 more under the change above or over the one below, or all of it; a small one all at once.
  const STEP = 20, gaps = new WeakMap(); // a gap's row -> its lines not shown yet, new numbers lo..hi
  for (const t of $$("table[data-path]")) {
    const src = t.closest(".collapsible-content").querySelector(":scope > .file-src");
    if (!src) continue;
    let text;
    const lines = () => text ??= JSON.parse(src.textContent).replace(/\n$/, "").split("\n");
    const n = +src.dataset.lines, hunks = $$("tr.hunk", t);
    const at = h => (/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/.exec($(".hunk-text", h).textContent) || []).slice(1).map(x => x === undefined ? 1 : +x);
    const add = (before, lo, hi, shift, upOk, downOk) => {
      if (hi < lo) return;
      const row = document.createElement("tr");
      row.className = "gap";
      row.innerHTML = '<td colspan="4"><div class="gap-bar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg><span></span></div></td>';
      const g = { lo, hi, row };
      const show = (a, b, where) => { // new lines a..b, before or after the gap's row
        const rs = lines().slice(a - 1, b).map((l, i) => {
          const r = document.createElement("tr");
          r.className = "ctx more";
          r.dataset.old = a + i + shift;
          for (const c of [a + i, "", l]) r.insertCell().textContent = c;
          return r;
        });
        row[where](...rs);
        document.dispatchEvent(new CustomEvent("diff:rows", { detail: { table: t, rows: rs } }));
        return rs;
      };
      // the buttons are made once and hidden when they don't fit: the one clicked keeps the focus, else Show N
      // does, else the first line it showed
      const bar = $(".gap-bar", row), label = $("span", bar);
      const btn = act => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "btn";
        b.dataset.variant = "outline";
        b.dataset.size = "xs";
        b.onclick = e => {
          e.stopPropagation();
          const had = row.contains(document.activeElement), rs = act();
          draw();
          if (had && !row.isConnected) rs[0].cells[2].tabIndex = -1, rs[0].cells[2].focus();
          else if (had && b.hidden) all.focus();
        };
        bar.append(b);
        return b;
      };
      const down = btn(() => { const rs = show(g.lo, g.lo + STEP - 1, "before"); g.lo += STEP; return rs; });
      const up = btn(() => { const rs = show(g.hi - STEP + 1, g.hi, "after"); g.hi -= STEP; return rs; });
      const all = btn(() => { const rs = show(g.lo, g.hi, "before"); g.lo = g.hi + 1; return rs; });
      down.textContent = "↓ " + STEP;
      down.setAttribute("aria-label", "Show " + STEP + " more lines under the change above");
      up.textContent = "↑ " + STEP;
      up.setAttribute("aria-label", "Show " + STEP + " more lines over the change below");
      const draw = () => {
        const left = g.hi - g.lo + 1;
        if (left <= 0) return void row.remove();
        label.textContent = left + " unchanged " + (left === 1 ? "line" : "lines");
        down.hidden = !(left > STEP && downOk);
        up.hidden = !(left > STEP && upOk);
        all.textContent = left > STEP ? "All" : "Show " + left;
        all.setAttribute("aria-label", "Show all " + left + " unchanged lines");
      };
      bar.onclick = g.all = () => all.click();
      gaps.set(row, g);
      before ? before.before(row) : t.createTBody().append(row);
      draw();
    };
    let end = 0; // the last new line the hunks above show
    for (const h of hunks) {
      const [a, , c, d] = at(h);
      if (c === undefined) continue;
      add(h, end + 1, c - 1, a - c, true, end > 0);
      end = c + d - 1;
    }
    const last = hunks.length ? at(hunks[hunks.length - 1]) : [];
    if (n && last.length) add(null, end + 1, n, last[0] + last[1] - last[2] - last[3], false, true);
  }

  // a jump opens what hides its target and lights it up: "#path:line" is the line of the file, by its new number,
  // else its old one; one in a gap opens it; the file when the diff doesn't show it. "#part=x" selects a box.
  const reveal = () => {
    const h = decodeURIComponent(location.hash.slice(1));
    const s = /^(part|table|box)=(.+)$/.exec(h);
    if (s) {
      const b = $$("#map .mb[data-box]").find(b => s[1] === "box" ? b.dataset.box === s[2] : b.dataset.box.startsWith(s[1] + ":") && b.dataset.label === s[2]);
      return b && select(b.dataset.box, true);
    }
    const m = /^(.+):(\d+)$/.exec(h);
    const find = f => $$("tr.add, tr.ctx", f).find(r => r.cells[0].textContent === m[2]) || $(`tr[data-old="${m[2]}"]`, f);
    const lineOf = f => f && (find(f) || ($$("tr.gap", f).map(r => gaps.get(r)).find(g => g.lo <= +m[2] && +m[2] <= g.hi)?.all(), find(f)) || f);
    const el = document.getElementById(h) || (m && lineOf(document.getElementById(m[1])));
    if (!el) return;
    if (el.closest("[data-item], .pb")?.hidden) select(null);
    openUp(el);
    if (el.matches(".file")) fileOpen(el, true);
    const fold = el.closest("tbody.fold");
    if (fold) { fold.classList.add("open"); $(".fold-toggle", fold).setAttribute("aria-expanded", true); }
    if (el.matches("tr.gone")) seeHunk(hunkOf(el), false);
    const at = window.inSplit?.(el) || el; // the side by side view's line, when it shows
    at.classList.remove("flash");
    void at.offsetWidth; // restart the animation
    at.classList.add("flash");
    at.scrollIntoView({ block: el.matches("tbody, tr") ? "center" : "start" });
  };
  addEventListener("hashchange", reveal);
  reveal();

  // keys: j and k the next and previous file, n the next open item, o all steps of the part at the top, v the file at
  // the top viewed; Esc closes the topmost sheet, popover or list, else clears the selection
  const head = 80;
  const shown = sel => $$(sel).filter(x => x.getClientRects().length);
  let last, lastAt = 0; // the smooth scroll to the last jump may still run: a key right after it goes on from there
  addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (closeSheet()) return;
      const open = pops.find(([, p]) => !document.getElementById(p).hidden);
      if (open) { closePops(); return document.getElementById(open[0]).focus(); }
      if (sel) select(null);
      return;
    }
    if (!keysOn() || composing(e) || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.target.closest?.("input, textarea, select, [contenteditable], [role=textbox], [role=searchbox]") || $("dialog:modal") || !sheet.hidden) return;
    const key = letter(e);
    const y = el => el.getBoundingClientRect().top - head;
    const files = shown(".file"), i = performance.now() - lastAt < 700 ? files.indexOf(last) : -1;
    let to;
    if (key === "j") to = i >= 0 ? files[i + 1] : files.find(f => y(f) > 8);
    else if (key === "k") to = i >= 0 ? files[i - 1] : files.findLast(f => y(f) < -8);
    else if (key === "n") { // the next item card the selection shows, after the focused one or under the top bar
      const items = $$("[data-item]").filter(c => !c.hidden && !c.closest("[hidden]:not(.pbx)"));
      const cur = document.activeElement?.closest?.("[data-item]");
      const next = cur ? items[items.indexOf(cur) + 1] : items.find(c => { const p = c.closest(".pbx[hidden]"); return y(p ? p.parentElement : c) > 8; });
      if (next) {
        e.preventDefault();
        openUp(next);
        const b = $(".icb", next) || $("h3", next); // a gate has no disclosure: its title takes focus
        next.scrollIntoView({ block: "start" });
        b.focus({ preventScroll: true });
      }
      return;
    }
    else if (key === "o") {
      const a = shown(".pb").findLast(p => y(p) <= 8)?.querySelector("[data-all-steps]");
      if (!a) return;
      e.preventDefault();
      openUp(a);
      return a.click();
    }
    else if (key === "v" && e.repeat) return; // held, it would mark the file and unmark it again
    else if (key === "v") shown(".file").find(f => f.getBoundingClientRect().bottom > head + 8)?.querySelector("input[data-key]").click();
    else return;
    e.preventDefault();
    if (to) { last = to; lastAt = performance.now(); history.replaceState(null, "", "#" + encodeURI(to.id)); reveal(); }
  });

  // the top bar: the short merge status while the panel isn't all in view (a phone's first screen shows it); the
  // rail: the section in view is current
  const stand = $("#stand");
  if (stand) new IntersectionObserver(([e]) => { for (const s of $$("[data-short]")) s.hidden = e.intersectionRatio > 0.99; }, { rootMargin: "-56px 0px 0px 0px", threshold: [0, 1] }).observe(stand);
  const rail = $$(".rail a.rrow");
  const spy = new IntersectionObserver(es => {
    const el = es.filter(e => e.isIntersecting).map(e => e.target).pop();
    if (!el) return;
    const id = "#" + (el.matches(".pb") && rail.some(a => a.getAttribute("href") === "#" + el.id) ? el.id : el.closest("section.sec")?.id || el.id);
    for (const a of rail) if (a.getAttribute("href") === id) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current");
  }, { rootMargin: "-15% 0px -75% 0px" });
  for (const el of $$("main section.sec, .pb")) spy.observe(el);
  sync();
})();
</script>
