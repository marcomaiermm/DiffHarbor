{{/* The page: disclosures, the map's hover and selection, filters, versions, viewed marks, the diff's gaps, keys. */}}
{{define "script"}}
<script>
(() => {
  const prefix = {{printf "diffharbor:%s#%d:" .Repo .Number}};
  const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const set = (k, on) => { try { on ? localStorage.setItem(k, on === true ? "1" : on) : localStorage.removeItem(k); } catch {} };
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const body = document.body;
  // What a keydown means, as TanStack Hotkeys reads it: nothing while an input method composes; the letter typed, else
  // the one on that key's place (a Cyrillic layout still has its J)
  const composing = e => e.isComposing || e.keyCode === 229 || e.key === "Process" || e.key === "Unidentified";
  const letter = e => /^[a-z]$/i.test(e.key) ? e.key.toLowerCase() : /^Key[A-Z]$/.test(e.code) ? e.code.slice(3).toLowerCase() : e.key;

  // the diff view: <html data-diff> unified or split, kept across PRs; the CSS and the split script do the rest
  const choose = v => {
    document.documentElement.dataset.diff = v;
    for (const b of $$("button[data-diff]")) b.setAttribute("aria-pressed", b.dataset.diff === v);
    set("diffharbor:diff", v);
  };
  choose(get("diffharbor:diff") || "unified");

  // disclosures: a button with aria-expanded shows the region it controls, by id or the element after it
  const bodyOf = b => b.getAttribute("aria-controls") ? document.getElementById(b.getAttribute("aria-controls"))
    : b.parentElement.matches("h3") ? b.parentElement.nextElementSibling : b.nextElementSibling;
  const disclose = (b, on) => {
    const r = bodyOf(b);
    if (!r) return;
    b.setAttribute("aria-expanded", on);
    r.hidden = !on;
    const t = b.dataset.on && b.querySelector("span");
    if (t) t.textContent = on ? b.dataset.on : b.dataset.off;
    if (b.dataset.traceBoxes !== undefined) { // the traced path and a selection exclude each other
      if (on && sel) select(null);
      trace(on, b);
    }
  };
  const discButtons = ".icb, .pbb, .sbtn, button[data-disc]";
  // a region inside closed ones: open each, outermost last, and a closed file too
  const fileOpen = (f, on) => { f.toggleAttribute("open", on); $(".file-toggle", f).setAttribute("aria-expanded", on); };
  const openUp = el => {
    for (let p = el; p && p !== body; p = p.parentElement) {
      if (p.matches(".file") && p !== el) fileOpen(p, true);
      if (!p.hidden) continue;
      const b = p.id && $(`[aria-controls="${CSS.escape(p.id)}"]`) || [p.previousElementSibling, p.previousElementSibling?.firstElementChild].find(x => x?.matches?.(discButtons));
      if (b) disclose(b, true); else p.hidden = false;
    }
  };

  // a file's head opens and closes its diff; the Viewed box beside it is not part of the button
  const boxes = $$("input[data-key]");
  // a part or a step is read once all its files are viewed: its header, its step row, its rail rows show the mark
  const mark = (el, on) => { el.classList.toggle("rd", on); const t = $("[data-rmark]", el); if (t) t.textContent = on ? ", read" : ", not read"; };
  const done = el => { const fs = $$(".file", el); return fs.length > 0 && fs.every(f => f.classList.contains("seen")); };
  const sync = () => {
    for (const b of boxes) b.closest(".file").classList.toggle("seen", b.checked);
    for (const s of $$("[data-step]")) mark($(".sbtn", s), done(s));
    for (const p of $$(".pb")) {
      const on = done(p);
      mark($(".pbb", p), on);
      if (p.dataset.box) for (const r of $$(`[data-rail-box="${CSS.escape(p.dataset.box)}"] .rrow`)) mark(r, on);
    }
    const all = !!$("#read") && done($("#read"));
    for (const r of $$('.rrow[href="#read"]')) mark(r, all);
    filter();
  };
  for (const b of boxes) {
    b.checked = !!get(prefix + b.dataset.key);
    if (b.checked) fileOpen(b.closest(".file"), false); // read already: a jump to it opens it again
    b.addEventListener("change", () => {
      set(prefix + b.dataset.key, b.checked);
      const d = b.closest(".file");
      if (b.checked && d.hasAttribute("open")) {
        fileOpen(d, false);
        if (d.getBoundingClientRect().top < 0) d.scrollIntoView(); // the next file starts where this one did
      }
      sync();
    });
  }

  // Read the change's filter: all, the files not viewed, the files changed since the Since base. For this page only
  let mode = "all";
  const read = $("#read");
  const filter = () => {
    if (!read) return;
    for (const f of $$(".file", read)) f.hidden = mode === "unviewed" ? $("input[data-key]", f)?.checked : mode === "changed" ? !f.hasAttribute("data-changed") : false;
    for (const s of $$("[data-step]", read)) s.hidden = mode !== "all" && !$$(".file", s).some(f => !f.hidden);
    for (const b of $$(".pb", read)) {
      const files = $$(".file", b);
      $("[data-empty]", b).hidden = mode === "all" || !files.length || files.some(f => !f.hidden);
    }
  };
  const setMode = m => {
    mode = m;
    for (const b of $$("button[data-filter]")) b.setAttribute("aria-pressed", b.dataset.filter === m);
    filter();
  };

  // the map: hover lights a box's lines and neighbours; a click selects it and narrows the page to it (5.14)
  const map = $("#map");
  const fig = key => map && $(`.mfig .mb[data-box="${CSS.escape(key)}"], .mbrow .mb[data-box="${CSS.escape(key)}"]`, map);
  const ids = s => (s || "").split(" ").filter(Boolean).map(id => document.getElementById(id)).filter(Boolean);
  const light = (b, cls, on) => {
    if (!b) return;
    for (const x of [b, ...ids(b.dataset.nb), ...ids(b.dataset.ln), ...ids(b.dataset.keep)]) x.classList.toggle(cls, on);
  };
  let sel = null, opener = null;
  const select = (key, quiet) => {
    if (sel) light(fig(sel), "nb", false);
    for (const m of $$(".mb.on")) m.classList.remove("on");
    for (const m of $$(".mb[aria-pressed=true]")) m.setAttribute("aria-pressed", false);
    for (const p of $$("[data-panel]")) p.hidden = true;
    sel = key;
    const b = key && fig(key);
    if (!b) {
      sel = null;
      delete body.dataset.sel;
      $("#fchip").hidden = true;
      for (const x of $$("[data-item], .pb, [data-rail-box], .kt tr")) { x.classList.remove("on"); x.removeAttribute("data-off"); }
      for (const x of $$("[data-item], .pb")) x.hidden = false;
      for (const x of $$("[data-rail-box]")) x.hidden = false;
      for (const s of $$("#before, #read")) { const e = $(":scope > [data-empty], .sbody > [data-empty]", s); if (e) e.hidden = true; }
      counts();
      if (!quiet && /^#(part|table|box)=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
      filter();
      return;
    }
    body.dataset.sel = key;
    const tb = $("#trace-b");
    if (tb?.getAttribute("aria-expanded") === "true") disclose(tb, false);
    light(b, "nb", true);
    b.classList.add("on");
    for (const m of $$(`.mb[data-box="${CSS.escape(key)}"]`)) m.setAttribute("aria-pressed", true);
    const panel = $(`[data-panel="${CSS.escape(key)}"]`);
    if (panel) panel.hidden = false;
    // the name may break after a slash, before a dot or an inner capital: <wbr>, never U+200B, so a copy stays clean
    const fname = $("#fname");
    fname.replaceChildren();
    b.dataset.label.split(/(?<=\/)|(?=\.)|(?<=[a-z])(?=[A-Z])|(?<=_)/).forEach((w, i) => { if (i) fname.append(document.createElement("wbr")); fname.append(w); });
    $("#fchip").hidden = false;
    // what stays: the box's items, and for a table the parts that write or read it and its migrations' items
    const keep = new Set([key, ...ids(b.dataset.keep).map(x => x.dataset.box)]);
    for (const c of $$("[data-item]")) c.hidden = !keep.has(c.dataset.box);
    for (const p of $$(".pb")) {
      p.hidden = !keep.has(p.dataset.box);
      if (!p.hidden && key.startsWith("part:")) disclose($(".pbb", p), true);
    }
    for (const r of $$("[data-rail-box]")) r.hidden = !keep.has(r.dataset.railBox);
    for (const r of $$(".kt tr[data-block]")) r.classList.toggle("on", keep.has($("#" + CSS.escape(r.dataset.block))?.dataset.box));
    for (const s of $$("#before, #read")) {
      const e = $(":scope > [data-empty], .sbody > [data-empty]", s), any = $$("[data-item], .pb", s).some(x => !x.hidden);
      if (e) { e.hidden = any; e.textContent = key.startsWith("table:") ? "Nothing here sits on the parts that write or read " + b.dataset.label + "." : "Nothing here sits on " + b.dataset.label + "."; }
    }
    counts();
    if (!quiet) {
      const [kind, name] = key.startsWith("table:") ? ["table", b.dataset.label] : key.startsWith("part:") ? ["part", b.dataset.label] : ["box", key];
      history.replaceState(null, "", "#" + kind + "=" + encodeURIComponent(name));
    }
  };
  // a section's count chip reads "{k} of {n}" while a selection hides some of its items
  const counts = () => {
    for (const c of $$("[data-count]")) {
      const all = $$("[data-item]", c.closest("section"));
      c.dataset.n ??= c.textContent;
      const shown = all.filter(x => !x.hidden).length;
      c.textContent = sel ? shown + " of " + c.dataset.n : c.dataset.n;
    }
  };
  if (map) {
    const tip = $("#mtip");
    map.addEventListener("pointerover", e => {
      const b = e.target.closest(".mb[data-box]"), p = e.target.closest(".mhit path");
      if (b) light(fig(b.dataset.box) || b, "hl", true);
      if (p) {
        document.getElementById(p.dataset.ln)?.classList.add("hl");
        if (p.dataset.tip) { tip.textContent = p.dataset.tip; tip.hidden = false; }
      }
    });
    map.addEventListener("pointermove", e => { if (!tip.hidden) { tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY + 16 + "px"; } });
    map.addEventListener("pointerout", e => {
      const b = e.target.closest(".mb[data-box]"), p = e.target.closest(".mhit path");
      if (b) light(fig(b.dataset.box) || b, "hl", false);
      if (p) { document.getElementById(p.dataset.ln)?.classList.remove("hl"); tip.hidden = true; }
    });
    map.addEventListener("focusin", e => { const b = e.target.closest(".mb[data-box]"); if (b) light(fig(b.dataset.box) || b, "hl", true); });
    map.addEventListener("focusout", e => { const b = e.target.closest(".mb[data-box]"); if (b) light(fig(b.dataset.box) || b, "hl", false); });
    map.addEventListener("click", e => {
      const b = e.target.closest(".mb[data-box]");
      if (b) select(sel === b.dataset.box ? null : b.dataset.box);
    });
    // one tab stop for the figure's boxes: the arrows move by column and row, Home and End to the first and last
    const figs = $$(".mfig .mb", map);
    const pos = b => [b.offsetLeft, b.offsetTop];
    figs.forEach((b, i) => b.tabIndex = i ? -1 : 0);
    map.addEventListener("keydown", e => {
      const b = e.target.closest(".mfig .mb");
      if (!b) return;
      const [x, y] = pos(b);
      let to;
      const near = (ok, d) => figs.filter(o => o !== b && ok(...pos(o))).sort((p, q) => d(...pos(p)) - d(...pos(q)))[0];
      if (e.key === "ArrowRight") to = near(ox => ox > x, (ox, oy) => (ox - x) * 1000 + Math.abs(oy - y));
      else if (e.key === "ArrowLeft") to = near(ox => ox < x, (ox, oy) => (x - ox) * 1000 + Math.abs(oy - y));
      else if (e.key === "ArrowDown") to = near((ox, oy) => ox === x && oy > y, (ox, oy) => oy - y);
      else if (e.key === "ArrowUp") to = near((ox, oy) => ox === x && oy < y, (ox, oy) => y - oy);
      else if (e.key === "Home") to = figs[0];
      else if (e.key === "End") to = figs[figs.length - 1];
      else return;
      e.preventDefault();
      if (!to) return;
      b.tabIndex = -1;
      to.tabIndex = 0;
      to.focus();
    });
    const more = $("[data-more-tables]", map);
    more?.addEventListener("click", () => { for (const b of $$("[data-more]", map)) b.hidden = false; more.parentElement.remove(); });
  }
  // the brief's sentences light their boxes
  for (const s of $$("[data-boxes]")) {
    const on = v => { const b = s.dataset.boxes && fig(s.dataset.boxes); if (b) b.classList.toggle("hl", v); };
    s.addEventListener("pointerenter", () => on(true));
    s.addEventListener("pointerleave", () => on(false));
    s.addEventListener("focusin", () => on(true));
    s.addEventListener("focusout", () => on(false));
  }
  // the traced path: while open, its boxes and lines take the ink and the rest fade
  const trace = (on, b) => {
    for (const x of [...ids(b.dataset.traceBoxes), ...ids(b.dataset.traceLines)]) x.classList.toggle("tr", on);
    if (on) body.dataset.trace = ""; else delete body.dataset.trace;
  };
  for (const c of $$("[data-clear]")) c.addEventListener("click", () => select(null));

  // popovers, the More list and the sheets: Esc closes the topmost and gives the focus back to what opened it
  const pops = [["ver-btn", "vermenu"], ["key-btn", "keypop"], ["more-btn", "morelist"]];
  const closePops = except => {
    for (const [b, p] of pops) if (p !== except && !document.getElementById(p).hidden) { document.getElementById(p).hidden = true; document.getElementById(b).setAttribute("aria-expanded", false); }
  };
  for (const [b, p] of pops) document.getElementById(b)?.addEventListener("click", e => {
    e.stopPropagation();
    const el = document.getElementById(p), on = el.hidden;
    closePops(p);
    el.hidden = !on;
    e.currentTarget.setAttribute("aria-expanded", on);
    if (on && p === "keypop") $("#key-title").focus();
  });
  document.addEventListener("click", e => { if (!e.target.closest(".pop, .mlist2")) closePops(); });
  for (const p of ["keypop"]) $(`#${p} [data-close]`)?.addEventListener("click", () => { closePops(); $("#key-btn").focus(); });
  const sheet = $("#sheet"), scrim = $("#scrim");
  const openSheet = (what, from) => {
    closePops();
    opener = from.closest("#morelist") ? $("#more-btn") : from;
    for (const p of $$("[data-sheet-part]", sheet)) p.hidden = p.dataset.sheetPart !== what;
    $("#sheet-title").textContent = { sections: "Sections", key: "Evidence key", versions: "Versions" }[what];
    sheet.hidden = scrim.hidden = false;
    modal(true);
    $("#sheet-title").focus();
  };
  // while the sheet is open the page behind it is inert and doesn't scroll
  const modal = on => {
    for (const x of $$("#topbar, .blockw, .lay")) x.inert = on;
    document.documentElement.style.overflow = on ? "hidden" : "";
  };
  // closing gives the focus back to what opened the sheet, or to the heading of the section a row goes to
  const closeSheet = to => {
    if (sheet.hidden) return false;
    sheet.hidden = scrim.hidden = true;
    modal(false);
    if (to) setTimeout(() => to.focus()); // after the jump: a jump to an element that takes no focus drops it
    else opener?.focus();
    return true;
  };
  for (const b of $$("[data-sheet]")) b.addEventListener("click", () => openSheet(b.dataset.sheet, b));
  scrim.addEventListener("click", () => closeSheet());
  $("[data-close]", sheet).addEventListener("click", () => closeSheet());
  sheet.addEventListener("click", e => {
    const a = e.target.closest("a[href^='#']");
    if (!a) return;
    const id = a.getAttribute("href").slice(1), t = document.getElementById(id);
    closeSheet(id === "top" ? $("#h-what") : t && $("h2[tabindex], h3 .pbb", t));
  });
  sheet.addEventListener("keydown", e => { // the focus stays in the sheet
    if (e.key !== "Tab") return;
    const f = $$("a[href], button, input", sheet).filter(x => x.getClientRects().length);
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
  $("#morelist")?.addEventListener("focusout", e => { if (!e.currentTarget.contains(e.relatedTarget) && e.relatedTarget !== $("#more-btn")) closePops(); });

  // single-key shortcuts: on unless the reader turned them off, for every PR
  const keysOn = () => get("diffharbor:keys") !== "off";
  const keys = on => {
    set("diffharbor:keys", on ? false : "off");
    for (const c of $$("input[data-keys]")) c.checked = on;
    for (const h of $$("[data-keyhint]")) h.hidden = !on;
  };
  keys(keysOn());
  for (const c of $$("input[data-keys]")) c.addEventListener("change", () => keys(c.checked));

  // the versions next to this page's URL: the menu's rows and a newer version's banner (none: a page alone)
  const base = location.pathname.replace(/\/+$/, "").replace(/\/[0-9a-f]{40}(?:[0-9a-f]{24})?$/, "");
  const sha = {{.SHA}}, prev = {{with .Prev}}{{.SHA}}{{else}}""{{end}};
  fetch(base + "/versions").then(r => r.ok ? r.json() : []).then(vs => {
    if (!Array.isArray(vs) || !vs.some(v => v.sha === sha)) return;
    const row = (v, i) => {
      const me = v.sha === sha, r = document.createElement(me ? "p" : "a");
      r.className = "mrow";
      if (me) r.setAttribute("aria-current", "page"); else r.href = (i ? base + "/" + v.sha : base) + location.hash;
      r.innerHTML = me ? $("#vermenu .mrow svg").outerHTML : '<span style="width: 16px;"></span>';
      const t = document.createElement("span");
      t.textContent = v.sha.slice(0, 7) + " · " + String(v.at).slice(0, 10);
      const note = me ? "this page" : v.sha === prev ? "compared with" : "";
      if (note) t.insertAdjacentHTML("beforeend", ' · <span class="ui12 i3">' + note + "</span>");
      r.append(t);
      return r;
    };
    for (const list of $$(".verrows")) list.replaceChildren(...vs.map(row));
    if (vs[0].sha !== sha) {
      const newer = $("#newer");
      $("a", newer).href = base + location.hash;
      newer.hidden = false;
    }
  }).catch(() => {});

  // a hunk marked seen hides its lines; all of a file's hunks seen is the file viewed
  const hunkOf = row => { // the hunk's header row
    const rows = [...row.closest("table").rows];
    return rows.slice(0, rows.indexOf(row) + 1).findLast(r => r.matches("tr.hunk"));
  };
  const hunkKey = h => {
    const t = h.closest("table");
    return prefix + $("input[data-key]", t.closest(".file")).dataset.key + "#" + $$("tr.hunk", t).indexOf(h);
  };
  const seeHunk = (h, on) => {
    const b = $(".hunk-seen", h);
    b.setAttribute("aria-pressed", on);
    b.textContent = on ? "Unfold" : "Fold";
    const rows = [...h.closest("table").rows];
    let n = 0;
    for (let i = rows.indexOf(h) + 1; i < rows.length && !rows[i].matches("tr.hunk, tr.gap"); i++) {
      rows[i].classList.toggle("gone", on);
      n += rows[i].matches("tr.add, tr.del, tr.ctx");
    }
    $(".hunk-folded", h).textContent = on ? n + (n === 1 ? " line" : " lines") + " folded" : "";
    set(hunkKey(h), on);
  };
  for (const h of $$("tr.hunk")) if (get(hunkKey(h))) seeHunk(h, true);

  document.addEventListener("click", e => {
    const t = e.target;
    const d = t.closest("button[data-diff]");
    if (d) return choose(d.dataset.diff);
    const f = t.closest("button[data-filter]");
    if (f) return setMode(f.dataset.filter);
    if (t.closest("[data-show-changed]")) { e.preventDefault(); setMode("changed"); $("#h-read").focus(); return $("#read").scrollIntoView({ block: "start" }); }
    const ft = t.closest(".file-toggle");
    if (ft) return fileOpen(ft.closest(".file"), !ft.closest(".file").hasAttribute("open"));
    const b = t.closest(discButtons);
    if (b) return disclose(b, b.getAttribute("aria-expanded") !== "true");
    const rv = t.closest("[data-reveal]");
    if (rv) {
      const rows = [rv.nextElementSibling, rv.parentElement.nextElementSibling, rv.parentElement.previousElementSibling].find(x => x?.matches("[data-more-rows]"));
      if (rows) { rows.hidden = false; rv.remove(); }
      return;
    }
    const ml = t.closest("[data-more-lines]");
    if (ml) { const x = $(".xmore", ml.previousElementSibling); if (x) x.hidden = false; return ml.remove(); }
    const hs = t.closest(".hunk-seen");
    if (hs) {
      const h = hs.closest("tr");
      seeHunk(h, hs.getAttribute("aria-pressed") !== "true");
      const tb = h.closest("table"), box = $("input[data-key]", tb.closest(".file"));
      if (!$$(".hunk-seen", tb).some(x => x.getAttribute("aria-pressed") !== "true") && !box.checked) {
        box.checked = true;
        box.dispatchEvent(new Event("change"));
      } else if (h.getBoundingClientRect().top < 80) h.scrollIntoView({ block: "start" });
      return;
    }
    const fo = t.closest(".fold-toggle");
    if (fo) fo.setAttribute("aria-expanded", fo.closest("tbody").classList.toggle("open"));
  });

  // the unchanged lines between and around hunks, from the file's text at the head: read once a gap opens. A gap
  // shows 20 more under the change above or over the one below, or all of it; a small one all at once.
  const STEP = 20, gaps = new WeakMap(); // a gap's row -> its lines not shown yet, new numbers lo..hi
  for (const t of $$("table[data-path]")) {
    const src = t.closest(".collapsible-content").querySelector(":scope > .file-src");
    if (!src) continue;
    let text;
    const lines = () => text ??= JSON.parse(src.textContent).replace(/\n$/, "").split("\n");
    const n = +src.dataset.lines, hunks = $$("tr.hunk", t);
    const at = h => (/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/.exec($(".hunk-text", h).textContent) || []).slice(1).map(x => x === undefined ? 1 : +x);
    const add = (before, lo, hi, shift, upOk, downOk) => {
      if (hi < lo) return;
      const row = document.createElement("tr");
      row.className = "gap";
      row.innerHTML = '<td colspan="4"><div class="gap-bar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg><span></span></div></td>';
      const g = { lo, hi, row };
      const show = (a, b, where) => { // new lines a..b, before or after the gap's row
        const rs = lines().slice(a - 1, b).map((l, i) => {
          const r = document.createElement("tr");
          r.className = "ctx more";
          r.dataset.old = a + i + shift;
          for (const c of [a + i, "", l]) r.insertCell().textContent = c;
          return r;
        });
        row[where](...rs);
        document.dispatchEvent(new CustomEvent("diff:rows", { detail: { table: t, rows: rs } }));
        return rs;
      };
      // the buttons are made once and hidden when they don't fit: the one clicked keeps the focus, else Show N
      // does, else the first line it showed
      const bar = $(".gap-bar", row), label = $("span", bar);
      const btn = act => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "btn";
        b.dataset.variant = "outline";
        b.dataset.size = "xs";
        b.onclick = e => {
          e.stopPropagation();
          const had = row.contains(document.activeElement), rs = act();
          draw();
          if (had && !row.isConnected) rs[0].cells[2].tabIndex = -1, rs[0].cells[2].focus();
          else if (had && b.hidden) all.focus();

      };
      const down = btn(() => { const rs = show(g.lo, g.lo + STEP - 1, "before"); g.lo += STEP; return rs; });

    const lineOf = f => f && (find(f) || ($$("tr.gap", f).map(r => gaps.get(r)).find(g => g.lo <= +m[2] && +m[2] <= g.hi)?.all(), find(f)) || f);
    const el = document.getElementById(h) || (m && lineOf(document.getElementById(m[1])));
    if (!el) return;

    if (el.matches(".file")) fileOpen(el, true);
    const fold = el.closest("tbody.fold");

    else if (key === "v") shown(".file").find(f => f.getBoundingClientRect().bottom > head + 8)?.querySelector("input[data-key]").click();
    else return;
    e.preventDefault();
    if (to) { last = to; lastAt = performance.now(); history.replaceState(null, "", "#" + encodeURI(to.id)); reveal(); }

  // the top bar: the short merge status while the panel isn't all in view (a phone's first screen shows it); the
  // rail: the section in view is current
  const stand = $("#stand");
  if (stand) new IntersectionObserver(([e]) => { for (const s of $$("[data-short]")) s.hidden = e.intersectionRatio > 0.99; }, { rootMargin: "-56px 0px 0px 0px", threshold: [0, 1] }).observe(stand);

})();
