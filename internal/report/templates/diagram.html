{{/* The mermaid diagram. */}}
{{define "diagram"}}
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
// Geist's grays: hairline boxes on the page's background
const dark = document.documentElement.classList.contains("dark");
const [bg, fg, box, line] = dark ? ["#0a0a0a", "#ededed", "#3a3a3a", "#6b6b6b"] : ["#ffffff", "#171717", "#d4d4d4", "#a1a1a1"];
mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "base", themeVariables: {
  darkMode: dark, fontFamily: "Geist Variable, ui-sans-serif, sans-serif", fontSize: "13px", background: bg,
  primaryColor: bg, primaryTextColor: fg, primaryBorderColor: box, secondaryColor: bg, tertiaryColor: bg, lineColor: line,
  clusterBkg: "transparent", clusterBorder: dark ? "#262626" : "#ebebeb", titleColor: dark ? "#a1a1a1" : "#6b6b6b",
  actorBkg: bg, actorBorder: box, actorTextColor: fg, signalColor: line, signalTextColor: fg, noteBkgColor: dark ? "#1a1a1a" : "#f5f5f5",
  noteBorderColor: box, noteTextColor: fg } });
await mermaid.run();
</script>
{{end}}
