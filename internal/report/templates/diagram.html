{{/* The mermaid diagram. */}}
{{define "diagram"}}
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs";
// the theme's grays: hairline boxes on the page's background
const dark = document.documentElement.classList.contains("dark");
const [bg, fg, box, line] = dark ? ["#1a1b26", "#c0caf5", "#3b4261", "#737aa2"] : ["#ffffff", "#171717", "#d4d4d4", "#a1a1a1"];
mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "base", themeVariables: {
  darkMode: dark, fontFamily: "Geist Variable, ui-sans-serif, sans-serif", fontSize: "13px", background: bg,
  primaryColor: bg, primaryTextColor: fg, primaryBorderColor: box, secondaryColor: bg, tertiaryColor: bg, lineColor: line,
  clusterBkg: "transparent", clusterBorder: dark ? "#292e42" : "#ebebeb", titleColor: dark ? "#98a1cc" : "#6b6b6b",
  actorBkg: bg, actorBorder: box, actorTextColor: fg, signalColor: line, signalTextColor: fg, noteBkgColor: dark ? "#1f2335" : "#f5f5f5",
  noteBorderColor: box, noteTextColor: fg } });
// in a closed card it draws once the card opens: a hidden diagram measures as nothing
const pre = document.querySelector("pre.mermaid"), card = pre.closest("details");
const draw = () => mermaid.run({ nodes: [pre] });
if (!card || card.open) await draw(); else card.addEventListener("toggle", draw, { once: true });
</script>
{{end}}
