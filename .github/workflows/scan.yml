name: Scan

# Known vulnerabilities in the published image's packages (Alpine, npm, Go binaries), into Security > Code scanning.
# Daily: a new CVE in an unchanged image, and :edge from the day's merges.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      security-events: write
      actions: read # the SARIF upload, in a private repo
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image's own osv-scanner reads the saved image; exit 1 = vulnerabilities found, which the upload shows.
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/diffharbor:edge
        run: |
          docker pull "$IMAGE" && docker save "$IMAGE" -o image.tar
          docker run --rm -v "$PWD:/w" --entrypoint osv-scanner "$IMAGE" scan image --archive /w/image.tar --format sarif --output-file /w/osv.sarif || [ $? -eq 1 ]
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner-image
