name: Release

# main -> image :edge. Merging release-please's PR -> tag, GitHub release, image :X.Y.Z, :X.Y, :latest.
# A pushed tag vX.Y.Z-rc.N -> prerelease and image :X.Y.Z-rc.N only.
on:
  push:
    branches: [main]
    tags: ['v*-rc.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  image:
    needs: release
    # Also on an rc tag, where release is skipped.
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/diffharbor
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.created == 'true' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.created == 'true' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version == 'edge' && format('edge-{0}', github.sha) || steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
