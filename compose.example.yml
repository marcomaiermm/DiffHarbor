# cp compose.example.yml compose.yml, put the values in .env next to it, docker compose up -d.
# Only POST /webhook/github and /webhook/gitlab need to be reachable from the forge; with REPORT_URL, /r/ too, best behind your SSO.
services:
  diffharbor:
    # Or build: . to build it yourself.
    image: ghcr.io/marcomaiermm/diffharbor:0.4.0 # x-release-please-version
    init: true
    # Idle is the Go server (~10 MB); the cap is for installs and type checks of big repos during checks.
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
    pids_limit: 4096 # a fork bomb in the PR's tests
    security_opt: [no-new-privileges:true] # no setuid binary takes node back to root
    # Root needs these to make the repos' users' work dirs, drop to them, kill their leftovers and clean up after them.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    ports: ["3000:3000"]
    environment:
      # GitHub App (README, GitHub). Leave empty for GitLab only.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # GitLab (README, GitLab). Leave GITLAB_TOKEN empty for GitHub only.
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_READ_TOKEN: ${GITLAB_READ_TOKEN:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      # Models as provider/id[:level]; empty = a repo's review.json, else picked by the keys present.
      REVIEW_MODEL: ${REVIEW_MODEL:-}
      VERIFY_MODEL: ${VERIFY_MODEL:-}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-}
      FALLBACK_VERIFY_MODEL: ${FALLBACK_VERIFY_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # A proxy or gateway in front of a provider (LiteLLM, a company's AI gateway): its URL, the key is the proxy's.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      # Claude on AWS Bedrock: region plus a Bedrock API key (stays in the server) or IAM keys (Pi gets them, see README, Security).
      AWS_REGION: ${AWS_REGION:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # GPT on Azure OpenAI: https://<resource>.openai.azure.com/openai/v1, deployments named like the models or mapped.
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_DEPLOYMENT_NAME_MAP: ${AZURE_OPENAI_DEPLOYMENT_NAME_MAP:-}
      # Optional: the itsaplan or Linear ticket a PR names goes into the review. With both configured, TICKET_PROVIDER picks one.
      ITSAPLAN_URL: ${ITSAPLAN_URL:-}
      ITSAPLAN_API_KEY: ${ITSAPLAN_API_KEY:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      TICKET_PROVIDER: ${TICKET_PROVIDER:-}
      # Optional: PR reports under /r/, at links only the PR's comment has. They hold the PR's code: an SSO in front is still best. Empty = no reports.
      REPORT_URL: ${REPORT_URL:-}
      # Optional: the reports in an S3 bucket instead of /data, https://host[:port]/bucket[/prefix] (README: Configuration).
      # With the seaweedfs service below: http://seaweedfs:8333/reports, and any key and secret you pick.
      REPORT_S3_URL: ${REPORT_S3_URL:-}
      REPORT_S3_ACCESS_KEY: ${REPORT_S3_ACCESS_KEY:-}
      REPORT_S3_SECRET_KEY: ${REPORT_S3_SECRET_KEY:-}
      REPORT_S3_REGION: ${REPORT_S3_REGION:-}
      # Optional: your logo, colors and templates for the report (README: Branding the report), with the volume below.
      # TEMPLATE_DIR: /branding
      DOCKER_HOST: tcp://dind:2375 # testcontainers in the checks; drop with the dind service if you don't need them
    # Root serves and holds the forge keys; git, checks and Pi run as a uid per repo and can't read root's environ.
    volumes:
      - diffharbor-data:/data # learnings, pending reviews, reports, Pi's ChatGPT login, the repos' uids
      - diffharbor-cache:/cache # per repo: package stores, Go modules; work dirs
      # - ./branding:/branding:ro
    # depends_on: [seaweedfs] # with the seaweedfs service: S3 is up when the server moves the reports on start

  # Docker for testcontainers (Postgres etc.) in the checks. The PR's code controls this daemon, so it holds no
  # secrets. sysbox-runc (https://github.com/nestybox/sysbox, on the host) isolates it without --privileged.
  dind:
    image: docker:29-dind
    runtime: sysbox-runc
    command: [--tls=false]
    environment:
      DOCKER_TLS_CERTDIR: "" # plain tcp://dind:2375, only on this stack's network
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
    volumes:
      - dind-data:/var/lib/docker

  # Optional: S3 for the reports (REPORT_S3_*). The key is its admin; the bucket comes with the first report. Only S3
  # listens on the network, and it wants the key: master, volume and filer stay on localhost, as PR code in the
  # checks shares this network. No port leaves the stack.
  # seaweedfs:
  #   image: chrislusf/seaweedfs:4.48
  #   command: [server, -ip=127.0.0.1, -ip.bind=127.0.0.1, -s3, -s3.ip.bind=0.0.0.0]
  #   environment:
  #     AWS_ACCESS_KEY_ID: ${REPORT_S3_ACCESS_KEY:?}
  #     AWS_SECRET_ACCESS_KEY: ${REPORT_S3_SECRET_KEY:?}
  #   restart: unless-stopped
  #   volumes:
  #     - seaweedfs-data:/data

volumes:
  diffharbor-data:
  diffharbor-cache:
  dind-data:
  # seaweedfs-data:
